<style>
:root{
 --bg:#f8f9fb;--surface:#fff;--surface2:#fbfbfd;--text:#17171b;--muted:#68686f;--line:#e8e8ed;
 --brand:#6b4eff;--brand-dark:#4f36d8;--aqua:#35c7c4;--pink:#f36bb5;--blue:#4b7cff;--green:#1aa981;
 --soft:#f4f1ff;--radius:18px;--radius-lg:28px;--shadow:0 18px 50px rgba(22,22,35,.07);--shadow2:0 8px 26px rgba(22,22,35,.055)
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fff 0,#fafafe 32%,#f7f8fb 100%);color:var(--text);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}.app{min-height:100vh}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid rgba(107,78,255,.18);outline-offset:2px}
.top{height:72px;background:rgba(255,255,255,.88);border-bottom:1px solid rgba(232,232,237,.9);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:30}.brand{display:flex;align-items:center;gap:11px;font-weight:850;font-size:20px;letter-spacing:-.035em}.brandmark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#7357ff,#4c7dff);box-shadow:0 8px 20px rgba(89,69,220,.24)}.brandmark svg{width:19px;height:19px}.brand span{color:#7564e9}.nav{display:flex;gap:2px}.nav button{border:0;background:transparent;padding:9px 12px;border-radius:10px;font-weight:700;color:#696970;transition:.16s}.nav button:hover{background:#f6f6f8;color:#222}.nav button.active{background:#f3f1ff;color:#5d46df}.top-actions{display:flex;align-items:center;gap:10px}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(26,169,129,.09)}
.shell{max-width:1480px;margin:auto;padding:28px 30px 64px}.view{display:none}.view.active{display:block}.titlebar{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:8px 0 20px}.titlebar h1{margin:0;font-size:clamp(29px,3vw,40px);letter-spacing:-.045em;line-height:1.05;font-weight:800}.titlebar p{margin:9px 0 0;color:var(--muted);font-size:14px;line-height:1.6}
.create-hero{position:relative;overflow:hidden;margin:0 0 26px;padding:42px 46px;border-radius:32px;background:linear-gradient(115deg,#f5f0ff 0%,#f6fbff 54%,#fff7fb 100%);border:1px solid #eeeaf9;box-shadow:0 24px 70px rgba(78,60,160,.08);color:var(--text)}.create-hero:before{content:"";position:absolute;width:330px;height:330px;border-radius:50%;right:-100px;top:-165px;background:radial-gradient(circle,rgba(101,75,255,.20),rgba(101,75,255,0) 68%)}.create-hero:after{content:"";position:absolute;width:250px;height:250px;border-radius:50%;right:175px;bottom:-150px;background:radial-gradient(circle,rgba(53,199,196,.17),rgba(53,199,196,0) 68%)}.hero-row{position:relative;z-index:1;display:flex;justify-content:space-between;gap:34px;align-items:center}.hero-copy{max-width:810px}.hero-kicker{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border-radius:999px;background:#fff;border:1px solid #e8e5f3;box-shadow:0 5px 18px rgba(54,44,100,.05);font-size:11.5px;font-weight:800;color:#654ce0;margin-bottom:15px}.create-hero h1{font-size:clamp(36px,4.4vw,58px);letter-spacing:-.06em;line-height:.98;margin:0 0 16px;max-width:850px;font-weight:850}.create-hero p{margin:0;color:#62626b;line-height:1.65;font-size:16px;max-width:760px}.hero-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:21px}.hero-badges span{font-size:11.5px;font-weight:750;padding:7px 10px;background:rgba(255,255,255,.82);border-radius:999px;border:1px solid #e8e6ef;color:#4b4b52}.hero-mini{min-width:232px;padding:22px;border-radius:22px;background:rgba(255,255,255,.82);border:1px solid #ebe8f3;box-shadow:0 12px 34px rgba(42,38,70,.06);backdrop-filter:blur(8px)}.hero-mini b{font-size:31px;display:block;letter-spacing:-.04em}.hero-mini small{color:#71717a;line-height:1.5;display:block;margin-top:5px}
.btn{border:1px solid #e1e1e6;background:#fff;color:#27272b;border-radius:11px;padding:10px 14px;font-weight:750;transition:.16s ease;box-shadow:0 2px 5px rgba(20,20,30,.025);text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:7px}.btn:hover{transform:translateY(-1px);border-color:#d4d4da;box-shadow:0 8px 20px rgba(24,24,40,.07)}.btn.primary,.btn.green{background:#17171b;color:#fff;border-color:#17171b;box-shadow:none}.btn.primary:hover,.btn.green:hover{background:#29292f;border-color:#29292f}.btn.danger{color:#bd315a;background:#fff7f9;border-color:#f1dce3}
.builder{display:grid;grid-template-columns:275px minmax(460px,1fr) 390px;gap:18px;align-items:start}.panel{background:rgba(255,255,255,.96);border:1px solid #e9e9ee;border-radius:20px;box-shadow:var(--shadow2)}.pad{padding:20px}.panel h3{margin:0 0 15px;font-size:15px;letter-spacing:-.015em}.section-label{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;margin-right:8px;background:#f1efff;color:#6249dd;font-size:11px;font-weight:850}.types{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:745px;overflow:auto;padding-right:3px}.type{position:relative;border:1px solid #e7e7ec;background:#fff;border-radius:12px;padding:12px 10px;text-align:left;font-size:12px;font-weight:750;color:#4e4e55;transition:.15s ease}.type:hover{border-color:#d8d3f7;background:#faf9ff}.type.active{border-color:#b9adff;box-shadow:0 0 0 2px rgba(107,78,255,.08);background:#f5f2ff;color:#5a43d3}.section{padding:20px 21px;border-bottom:1px solid #eeeeF2}.section:last-child{border-bottom:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:13px}.field:last-child{margin-bottom:0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:7px;color:#505057}.field small{display:block;color:#85858d;margin-top:6px;line-height:1.45}.input{width:100%;border:1px solid #dedee4;border-radius:10px;padding:11px 12px;background:#fff;color:var(--text);outline:none;transition:.15s ease}.input:hover{border-color:#cfcfd7}.input:focus{border-color:#9f91ef;box-shadow:0 0 0 3px rgba(107,78,255,.08)}textarea.input{min-height:102px;resize:vertical}.seg{display:flex;background:#f5f5f7;border:1px solid #ececef;border-radius:11px;padding:3px}.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:9px;font-weight:750;color:#73737b;transition:.15s}.seg button.active{background:#fff;color:#252529;box-shadow:0 2px 8px rgba(30,30,45,.07)}.acc{border:1px solid #e8e8ed;border-radius:13px;margin-bottom:9px;overflow:hidden;background:#fff}.acc summary{list-style:none;padding:13px 14px;font-weight:750;cursor:pointer;color:#36363b;font-size:13px}.acc summary:after{content:"+";float:right;color:#777780;font-size:17px;font-weight:500}.acc[open] summary:after{content:"–"}.acc summary
