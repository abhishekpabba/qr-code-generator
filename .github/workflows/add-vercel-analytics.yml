name: Add Vercel visitor analytics
on:
  push:
    paths: ['.github/workflows/add-vercel-analytics.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add analytics to public HTML pages and update privacy copy
        shell: python
        run: |
          from pathlib import Path
          script='<script defer src="/_vercel/insights/script.js"></script>'
          for p in Path('public').rglob('*.html'):
              s=p.read_text()
              if '/_vercel/insights/script.js' not in s:
                  s=s.replace('</head>',script+'</head>',1)
              if p.as_posix()=='public/privacy/index.html':
                  old='<h2>Analytics and advertising</h2><p>We may use website analytics and advertising services to understand traffic and support the free service. These services may use cookies or similar technologies according to their own privacy policies.</p>'
                  new='<h2>Analytics and advertising</h2><p>We use Vercel Web Analytics to understand aggregate website traffic, including visits, page views, popular pages, referrers, general location, browser, operating system and device type. This helps us improve the service and understand when the site has enough usage to support advertising. We do not use this analytics data to identify individual visitors.</p><p>If advertising services are added later, this policy will be updated to describe the relevant cookies or similar technologies.</p>'
                  s=s.replace(old,new)
              p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'QR Analytics Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public
          git commit -m 'Enable Vercel Web Analytics visitor tracking' || exit 0
          git push
