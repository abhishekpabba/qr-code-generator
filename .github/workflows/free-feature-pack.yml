name: Free QR feature pack
on:
  push:
    paths: ['.github/workflows/free-feature-pack.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add free features
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/index.html'); s=p.read_text()
          # Extra styles
          css='''<style>
          .quickbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:700}.chip.active{background:var(--soft);border-color:#9b8dec;color:#5942d1}.advanced{display:none}.advanced.open{display:block}.history-list{display:grid;gap:7px;max-height:180px;overflow:auto}.history-item{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:11px}.mobile-float{display:none;position:fixed;right:12px;bottom:14px;z-index:50;width:86px;height:86px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 35px #0002;padding:7px}.mobile-float img{width:100%;height:100%;object-fit:contain}.bulk-box{display:none;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;background:#fafafd}.bulk-box.open{display:block}.frame-preview{position:relative}.cta-label{text-align:center;font-weight:850;letter-spacing:.04em;padding:8px 12px}.preset-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.preset{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 5px;font-size:11px;font-weight:700}@media(max-width:600px){.mobile-float{display:block}.preset-row{grid-template-columns:repeat(2,1fr)}}
          </style>'''
          s=s.replace('</head>',css+'</head>')
          # Add social/payment QR types to More
          s=s.replace('<button class="type" data-type="vcard">Contact</button>','<button class="type" data-type="vcard">Contact</button><button class="type" data-type="instagram">Instagram</button><button class="type" data-type="tiktok">TikTok</button><button class="type" data-type="youtube">YouTube</button><button class="type" data-type="paypal">PayPal</button><button class="type" data-type="venmo">Venmo</button><button class="type" data-type="upi">UPI</button><button class="type" data-type="bitcoin">Bitcoin</button>')
          # Add easy feature controls before shape section
          anchor='<div class="section"><h3>QR code shape</h3>'
          pack='''<div class="section"><h3>Quick styles</h3><div class="preset-row"><button class="preset" data-preset="minimal">Minimal</button><button class="preset" data-preset="corporate">Corporate</button><button class="preset" data-preset="neon">Neon</button><button class="preset" data-preset="playful">Playful</button></div><div class="quickbar"><button id="resetDesign" class="chip">↺ Reset design</button><button id="toggleAdvanced" class="chip">Advanced design</button><button id="toggleBulk" class="chip">Bulk CSV</button></div><div id="bulkBox" class="bulk-box"><b>Bulk QR generator</b><p class="sub">Upload a CSV with one value per row. We’ll generate downloadable PNG QR codes.</p><input id="bulkFile" type="file" accept=".csv,text/csv" class="input"><div id="bulkResults" class="history-list" style="margin-top:10px"></div></div></div><div id="advancedDesign" class="advanced"><div class="section"><h3>Gradient & frame</h3><div class="grid2"><div class="field"><label>Second gradient color</label><input id="grad2" type="color" value="#6755e7" class="input"></div><div class="field"><label>Color style</label><select id="gradientMode" class="input"><option value="none">Solid</option><option value="linear">Linear gradient</option><option value="radial">Radial gradient</option></select></div><div class="field"><label>CTA frame</label><select id="ctaFrame" class="input"><option value="none">No frame</option><option value="scan">SCAN ME</option><option value="wifi">CONNECT TO WI-FI</option><option value="follow">FOLLOW US</option><option value="custom">Use text below QR</option></select></div></div></div></div>'''
          s=s.replace(anchor,pack+anchor)
          # History before preview closes
          s=s.replace('<div id="status" class="status"></div></aside>','<div id="status" class="status"></div><div class="section"><h3>Recent QR codes</h3><div id="recentHistory" class="history-list"></div></div></aside>')
          s=s.replace('</main>','</main><button id="mobileFloat" class="mobile-float" aria-label="Open live QR preview"><img id="mobileFloatImg" alt="Live QR thumbnail"></button>')
          # Feature script, intentionally layered on existing generator
          js=r'''<script>
          (()=>{
            const $=id=>document.getElementById(id); const q=(s)=>document.querySelector(s);
            const presets={minimal:{fg:'#111111',bg:'#ffffff',dot:'square'},corporate:{fg:'#16324f',bg:'#ffffff',dot:'rounded'},neon:{fg:'#7c3aed',bg:'#09090b',dot:'dots'},playful:{fg:'#e11d48',bg:'#fff7ed',dot:'extra-rounded'}};
            document.querySelectorAll('.preset').forEach(b=>b.addEventListener('click',()=>{const p=presets[b.dataset.preset];$('fg').value=p.fg;$('bg').value=p.bg;$('dotStyle').value=p.dot;['fg','bg','dotStyle'].forEach(id=>$(id).dispatchEvent(new Event('input',{bubbles:true})));}));
            $('resetDesign')?.addEventListener('click',()=>{$('fg').value='#111111';$('bg').value='#ffffff';$('dotStyle').value='square';$('qrSize').value=320;$('logoSize').value=24;$('labelText').value='';$('grad2').value='#6755e7';$('gradientMode').value='none';$('ctaFrame').value='none';['fg','bg','dotStyle','qrSize','logoSize','labelText'].forEach(id=>$(id)?.dispatchEvent(new Event('input',{bubbles:true})));});
            $('toggleAdvanced')?.addEventListener('click',()=>{$('advancedDesign').classList.toggle('open')});
            $('toggleBulk')?.addEventListener('click',()=>{$('bulkBox').classList.toggle('open')});
            // Extend type fields without changing the stable core generator.
            document.addEventListener('click',e=>{const b=e.target.closest('.type');if(!b)return;setTimeout(()=>{const f=$('fields'); if(!f)return; const t=b.dataset.type; const map={instagram:['Instagram profile','https://instagram.com/username'],tiktok:['TikTok profile','https://tiktok.com/@username'],youtube:['YouTube channel','https://youtube.com/@channel'],paypal:['PayPal link','https://paypal.me/username'],venmo:['Venmo link','https://venmo.com/u/username'],upi:['UPI payment','upi://pay?pa=name@bank&pn=Name'],bitcoin:['Bitcoin address','bitcoin:YOUR_ADDRESS']}; if(map[t]){f.innerHTML=`<div class="field"><label>${map[t][0]}</label><input id="url" class="input" value="${map[t][1]}"></div>`;f.querySelector('input').addEventListener('input',()=>document.querySelector('[data-type="url"]')?.dispatchEvent(new Event('input')));}},0)});
            // Keep a local recent list of generated previews.
            let last=''; const saveHistory=()=>{const img=$('qrImage');if(!img?.src||img.src===last)return;last=img.src;let h=[];try{h=JSON.parse(localStorage.getItem('qrRecent')||'[]')}catch{};h.unshift({src:img.src,at:Date.now()});h=h.slice(0,6);try{localStorage.setItem('qrRecent',JSON.stringify(h))}catch{};renderHistory();$('mobileFloatImg').src=img.src};
            const renderHistory=()=>{const box=$('recentHistory');if(!box)return;let h=[];try{h=JSON.parse(localStorage.getItem('qrRecent')||'[]')}catch{};box.innerHTML=h.length?h.map((x,i)=>`<div class="history-item"><span>QR ${i+1} · ${new Date(x.at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span><a href="${x.src}" download="qr-recent-${i+1}.png">Download</a></div>`).join(''):'<span class="sub">Your recent QR codes will appear here.</span>'};renderHistory();
            new MutationObserver(()=>setTimeout(saveHistory,250)).observe($('qrImage'),{attributes:true,attributeFilter:['src']});
            $('mobileFloat')?.addEventListener('click',()=>document.querySelector('.preview')?.scrollIntoView({behavior:'smooth',block:'start'}));
            // CTA labels are mirrored into the existing text-below field so exports include them.
            $('ctaFrame')?.addEventListener('change',e=>{const m={scan:'SCAN ME',wifi:'CONNECT TO WI-FI',follow:'FOLLOW US'};if(m[e.target.value]){$('labelText').value=m[e.target.value];$('labelText').dispatchEvent(new Event('input',{bubbles:true}))}});
            // Gradient is applied to the final raster preview so it works with the existing renderer.
            const recolor=()=>{const mode=$('gradientMode')?.value;if(!mode||mode==='none')return;const img=$('qrImage');if(!img?.complete||!img.naturalWidth)return;const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext('2d');x.drawImage(img,0,0);const d=x.getImageData(0,0,c.width,c.height);const a=hex($('fg').value),b=hex($('grad2').value);for(let y=0;y<c.height;y++)for(let xx=0;xx<c.width;xx++){const i=(y*c.width+xx)*4;if(d.data[i]+d.data[i+1]+d.data[i+2]<500){let t=mode==='radial'?Math.min(1,Math.hypot(xx-c.width/2,y-c.height/2)/(c.width*.7)):(xx+y)/(c.width+c.height);d.data[i]=a[0]+(b[0]-a[0])*t;d.data[i+1]=a[1]+(b[1]-a[1])*t;d.data[i+2]=a[2]+(b[2]-a[2])*t}}x.putImageData(d,0,0);img.src=c.toDataURL('image/png')};function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
            $('gradientMode')?.addEventListener('change',()=>setTimeout(recolor,500));$('grad2')?.addEventListener('input',()=>setTimeout(recolor,500));
            // Client-side bulk: each CSV row becomes a QR PNG link; no upload/storage required.
            $('bulkFile')?.addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;const rows=(await file.text()).split(/\r?\n/).map(x=>x.split(',')[0].trim()).filter(Boolean).slice(0,100);const out=$('bulkResults');out.innerHTML='Generating…';const items=[];for(let i=0;i<rows.length;i++){const host=document.createElement('div');host.style.cssText='position:fixed;left:-9999px';document.body.appendChild(host);const q=new QRCodeStyling({width:500,height:500,type:'canvas',data:rows[i],margin:18,qrOptions:{errorCorrectionLevel:'Q'}});q.append(host);await new Promise(r=>setTimeout(r,45));const c=host.querySelector('canvas');if(c)items.push(`<div class="history-item"><span>${i+1}. ${rows[i].slice(0,35)}</span><a download="qr-${i+1}.png" href="${c.toDataURL('image/png')}">PNG</a></div>`);host.remove()}out.innerHTML=items.join('')||'No valid rows found.'});
          })();
          </script>'''
          s=s.replace('</body>',js+'</body>')
          p.write_text(s)
      - name: Commit feature pack
        run: |
          git config user.name 'QR Feature Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/index.html
          git commit -m 'Add free QR presets bulk gradients history payments and mobile preview' || exit 0
          git push
