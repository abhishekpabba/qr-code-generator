name: Publish tested QR UI
on:
  push:
    paths:
      - '.github/workflows/patch-qr-ui.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish tested UI at root
        run: cp public/index-v4.html public/index.html
      - name: Validate JavaScript syntax
        run: |
          python <<'PY'
          import re
          from pathlib import Path
          s=Path('public/index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/qr-app.js').write_text(scripts[-1])
          PY
          node --check /tmp/qr-app.js
      - name: Commit root page
        run: |
          git config user.name "QR UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html
          git commit -m "Publish tested QR UI to production root"
          git push
