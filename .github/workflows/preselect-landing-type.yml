name: Landing page type preselection
on:
  push:
    paths: ['.github/workflows/preselect-landing-type.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add query parameter preselection
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/index.html'); s=p.read_text()
          hook="""<script>
          window.addEventListener('DOMContentLoaded',()=>{
            const requested=new URLSearchParams(location.search).get('type');
            if(!requested)return;
            const btn=document.querySelector(`.type[data-type="${CSS.escape(requested)}"]`);
            if(!btn)return;
            const more=document.getElementById('moreTypes');
            if(more?.contains(btn) && !more.classList.contains('open')) document.getElementById('toggleTypes')?.click();
            setTimeout(()=>{btn.click();document.querySelector('.workspace')?.scrollIntoView({behavior:'smooth',block:'start'});},80);
          });
          </script>"""
          s=s.replace('</body>',hook+'</body>')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'QR UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/index.html
          git commit -m 'Support QR type preselection from SEO landing pages' || exit 0
          git push
